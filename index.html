<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#07060a">
  <meta name="description" content="A haunted journal. Your memories become VHS tapes hidden in a dark house. Find them and rewind them before they decay.">
  <title>Rewind 1970</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage" aria-label="Rewind 1970">
    <canvas id="screen" aria-hidden="true"></canvas>
    <div id="hotspots" hidden></div>
    <nav id="nav" aria-label="ways out" hidden></nav>

    <p id="hint" class="hint" role="status" aria-live="polite"></p>
    <div id="boot-text" class="sr-only" aria-live="polite"></div>

    <div id="no-webgl" class="no-webgl" hidden>
      <p>this tape won't play here.</p>
      <p>your browser can't show the house (WebGL is off or unsupported). you can still write and read tapes from <strong>settings</strong>.</p>
    </div>
  </main>

  <button id="settings-button" class="settings-button" type="button">settings</button>

  <dialog id="tape-writer" class="panel writer" aria-labelledby="writer-title">
    <form>
      <h2 id="writer-title"><span class="rec" aria-hidden="true">&#9679;</span> REC</h2>
      <label class="field">
        <span>label</span>
        <input name="label" type="text" autocomplete="off" placeholder="leave blank to use the first words">
      </label>
      <label class="field">
        <span>memory</span>
        <textarea name="text" rows="8" placeholder="what do you want to keep?"></textarea>
      </label>
      <p class="writer-meta"><span class="writer-count">0 / 4000</span><span>stays on this device</span></p>
      <p class="writer-error" role="alert"></p>
      <div class="actions">
        <button type="button" data-action="eject">eject</button>
        <button type="submit">record</button>
      </div>
    </form>
  </dialog>

  <dialog id="settings" class="panel settings" aria-labelledby="settings-title">
    <h2 id="settings-title">settings</h2>
    <label class="toggle"><input type="checkbox" name="reduceFlashing"> reduce flashing</label>
    <label class="toggle"><input type="checkbox" name="sound"> sound</label>
    <label class="toggle"><input type="checkbox" name="demoTime"> demo time: one minute is one day <span class="toggle-note">(tapes decay much faster)</span></label>

    <h3>tapes (text only)</h3>
    <ul class="reader-list"></ul>
    <div class="actions">
      <button type="button" data-action="write">write a tape</button>
      <button type="button" data-action="export">export tapes</button>
      <button type="button" data-action="delete" class="danger">erase all tapes</button>
    </div>
    <p class="settings-status" role="status"></p>
    <div class="actions">
      <button type="button" data-action="close">close</button>
    </div>
  </dialog>

  <dialog id="playback" class="panel playback" aria-labelledby="playback-label">
    <canvas class="playback-noise" width="160" height="120" aria-hidden="true"></canvas>
    <p class="playback-osd" aria-hidden="true"><span class="playback-state">PLAY</span><span class="playback-tracking"></span></p>
    <h2 id="playback-label" class="playback-label"></h2>
    <time class="playback-date"></time>
    <div class="playback-text" tabindex="-1" autofocus></div>
    <p class="playback-note" role="status"></p>
    <div class="actions">
      <button type="button" data-action="eject">eject</button>
    </div>
  </dialog>

  <noscript><p class="no-webgl">this tape needs JavaScript to play.</p></noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
